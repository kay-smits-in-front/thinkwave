{% extends "base.html" %}

{% block title %}Account aanmaken – Thinkwave{% endblock %}

{% block content %}
  <h1>Account aanmaken</h1>

  {% if error %}
    <p class="error" role="alert">{{ error }}</p>
  {% endif %}

  <form method="post" action="{{ url_for('registration.submit_registration') }}">
    <label for="organisation_name">Naam organisatie</label>
    <input id="organisation_name" name="organisation_name" required maxlength="120"
           value="{{ form.organisation_name or '' }}" autocomplete="organization">

    <label for="email">E-mailadres</label>
    <input id="email" name="email" type="email" required maxlength="254"
           value="{{ form.email or '' }}" autocomplete="email">

    <label for="password">Wachtwoord (minimaal 12 tekens)</label>
    <input id="password" name="password" type="password" required minlength="12"
           autocomplete="new-password">

    <button type="submit">Account aanmaken</button>
  </form>
{% endblock %}

<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Thinkwave{% endblock %}</title>
  <meta name="description" content="{% block description %}Thinkwave is de AI-innovatietool. Develop AI projects. Develop with AI.{% endblock %}">
  <meta name="theme-color" content="#082235">
  {# HTMX toont standaard niets bij 4xx/5xx; onze foutpagina's (bijv. verkeerd wachtwoord) moeten wel verschijnen. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}'>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='brand/logo-red.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/thinkwave.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous" defer></script>
</head>
<body hx-boost="true" hx-headers='{"X-CSRF-Token": "{{ csrf_token() }}"}'>
  <a class="skip-link" href="#main">Naar de inhoud</a>
  {% block body %}{% endblock %}
</body>
</html>

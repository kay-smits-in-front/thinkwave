name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thinkwave_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql://postgres:postgres@localhost:5432/thinkwave_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migraties lopen en komen overeen met de modellen
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db check
        env:
          DATABASE_URL: ${{ env.PG_URL }}
      - name: Tests op SQLite
        run: pytest -q -W error::sqlalchemy.exc.SAWarning
      - name: Tests op PostgreSQL
        run: pytest -q -W error::sqlalchemy.exc.SAWarning
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
